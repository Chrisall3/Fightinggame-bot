<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CounterDash | Professional Matchup Lab</title>
    <link rel="stylesheet" href="style.css">
    <script src="sb_publishable_ctE74i6vEzCys2K7bTvttA_6iZ9XD3Y"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="navigateTo('dashboard')">COUNTER<span>DASH</span></div>
        <div class="nav-right">
            <span id="userGreeting"></span>
            <button id="navAuthBtn" class="btn-nav" onclick="navigateTo('auth')">Sign In</button>
        </div>
    </nav>

    <main id="page-dashboard" class="view-container">
        <header class="hero">
            <h1>Expert Counterplay</h1>
            <div class="search-box">
                <input type="text" id="charSearch" placeholder="Search character (e.g., Beerus)...">
            </div>
        </header>
        <div class="character-grid" id="charGrid"></div>
    </main>

    <main id="page-auth" class="view-container" style="display: none;">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button id="tab-login" class="active" onclick="switchAuthMode('login')">Sign In</button>
                    <button id="tab-signup" onclick="switchAuthMode('signup')">New Account</button>
                </div>

                <div id="auth-form-content">
                    <h2 id="auth-header">Welcome Back</h2>
                    
                    <div class="form-group" id="group-username" style="display:none;">
                        <label>Username</label>
                        <input type="text" id="reg-username" placeholder="FighterName77">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="reg-email" placeholder="email@example.com">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••">
                    </div>

                    <div class="form-group" id="group-confirm" style="display:none;">
                        <label>Confirm Password</label>
                        <input type="password" id="reg-confirm" placeholder="••••••••">
                    </div>

                    <button id="auth-submit-btn" class="btn-main" onclick="processAuth()">Sign In</button>
                    <p id="auth-msg"></p>
                </div>
                <button class="btn-link" onclick="navigateTo('dashboard')">← Back to Dashboard</button>
            </div>
        </div>
    </main>

    <div id="strategyOverlay" class="overlay" onclick="closeStrategy()">
        <div class="strategy-card" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeStrategy()">&times;</span>
            <div id="strategyBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
