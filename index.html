<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CounterDash | Open Matchup Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">COUNTER<span>DASH</span></div>
        <div class="search-container">
            <input type="text" id="charSearch" placeholder="Search character or game...">
        </div>
    </nav>

    <header class="hero">
        <h1>Stop Guessing. Start Countering.</h1>
        <p>Expert-level counterplay for the most frustrating matchups in fighting games.</p>
    </header>

    <main class="container">
        <div class="character-grid" id="charGrid"></div>
    </main>

    <div id="strategyOverlay" class="overlay" onclick="closeStrategy()">
        <div class="strategy-card" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeStrategy()">&times;</span>
            <div id="strategyBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
